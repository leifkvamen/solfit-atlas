<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SolFit Atlas">
<meta name="theme-color" content="#0F0E0B">
<title>SolFit Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#0F0E0B; --card:#1A1712; --card2:#26221A; --line:#332D22;
  --gold:#F5C842; --gold2:#C89B1F; --sky:#7FB4D9; --green:#8FCB8F; --red:#E0604D;
  --text:#F2EDE3; --text2:#A69B85; --text3:#6E6452;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-size:16px;min-height:100vh}
#app{max-width:430px;margin:0 auto;padding:calc(14px + var(--safe-top)) 16px calc(90px + var(--safe-bottom))}
h1{font-weight:800;font-size:26px;letter-spacing:-.02em;text-transform:uppercase;font-style:italic}
h2{font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin:22px 0 10px}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card2{background:var(--card2)}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between}
.btn{display:block;width:100%;background:var(--gold);color:#141105;border:none;border-radius:12px;padding:14px;font-family:'Outfit';font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold2)}
.btn.dim{background:var(--card2);color:var(--text2);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:12px;border-radius:9px;width:auto;display:inline-block}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--text2)}
.badge.gold{color:var(--gold);border-color:var(--gold2)}
.badge.sky{color:var(--sky);border-color:#3d5a70}
.badge.green{color:var(--green);border-color:#3f5c3f}
.muted{color:var(--text2);font-size:13px}
.tiny{color:var(--text3);font-size:11.5px;letter-spacing:.03em}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font-family:'JetBrains Mono';font-size:15px;width:100%}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label{display:block;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px;font-weight:600}
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(20,17,12,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-bottom);z-index:100}
.nav-btn{flex:1;background:none;border:none;color:var(--text3);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:10px;font-weight:600;letter-spacing:.05em;font-family:'Outfit'}
.nav-btn.active{color:var(--gold)}
.nav-btn svg{width:22px;height:22px}
.ring-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.check{width:26px;height:26px;min-width:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:transparent;transition:all .15s}
.check.on{background:var(--gold);border-color:var(--gold);color:#141105;font-weight:900}
.check.green.on{background:var(--green);border-color:var(--green)}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.set-grid{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.set-grid input{padding:8px;text-align:center;font-size:14px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 18px calc(24px + var(--safe-bottom));width:100%;max-width:430px;max-height:85vh;overflow-y:auto}
.week-pill{min-width:40px;padding:8px 0;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text2);font-family:'JetBrains Mono';font-size:13px;cursor:pointer;flex-shrink:0}
.week-pill.cur{border-color:var(--gold);color:var(--gold);font-weight:700}
.week-pill.sel{background:var(--gold);color:#141105;border-color:var(--gold);font-weight:700}
.hscroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.stat{background:var(--card2);border-radius:12px;padding:12px;text-align:center;flex:1}
.stat .v{font-family:'JetBrains Mono';font-weight:700;font-size:20px;color:var(--gold)}
.stat .l{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.macro-bar{display:flex;gap:8px;margin-top:10px}
.macro{flex:1;background:var(--card2);border-radius:10px;padding:8px;text-align:center}
.macro .v{font-family:'JetBrains Mono';font-weight:600;font-size:14px}
.macro .l{font-size:10px;color:var(--text3);text-transform:uppercase;margin-top:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gear{background:none;border:none;color:var(--text3);cursor:pointer;padding:6px}
.session-hero{border-radius:16px;padding:18px;margin-bottom:12px;border:1px solid var(--line);position:relative;overflow:hidden}
.session-hero.gym{background:linear-gradient(135deg,#26200f, #1A1712)}
.session-hero.cardio{background:linear-gradient(135deg,#14202a, #1A1712)}
.session-hero.rest{background:linear-gradient(135deg,#1c2418, #1A1712)}
.toast{position:fixed;top:calc(14px + var(--safe-top));left:50%;transform:translateX(-50%);background:var(--gold);color:#141105;font-weight:700;padding:10px 18px;border-radius:99px;z-index:300;font-size:14px}
</style>
</head>

const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const dayIdxOf = d => (d.getDay()+6)%7;
const DAYS = ['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];

function currentWeek(){
  const diff = Math.floor((new Date().setHours(0,0,0,0) - START.getTime()) / 864e5);
  if (diff < 0) return 0;
  return Math.min(Math.floor(diff/7)+1, TOTAL_WEEKS+1);
}
function daysToTrip(){ return Math.max(0, Math.ceil((TRIP.getTime() - new Date().setHours(0,0,0,0)) / 864e5)); }
function phaseOf(w){ return PHASES.find(p => w>=p.weeks[0] && w<=p.weeks[1]) || (w<1 ? PHASES[0] : PHASES[3]); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function latestWeight(){
  const w = plog.filter(p=>p.weight!=null).sort((a,b)=>a.date<b.date?1:-1);
  return w[0] || null;
}
function targetWeightOn(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const total = (TRIP-START)/864e5;
  const gone = Math.min(Math.max((d-START)/864e5,0), total);
  return WEIGHT_START - (WEIGHT_START-WEIGHT_GOAL)*(gone/total);
}
function prFor(exId){
  let best = 0;
  wlog.filter(w=>w.type==='gym').forEach(w => (w.data.exercises||[]).forEach(e=>{
    if(e.id===exId) e.sets.forEach(s=>{ if(s.kg>best) best=s.kg; });
  }));
  return best;
}
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
}

async function syncWithings(){
  if(!settings.workerUrl) return;
  try{
    const r = await fetch(settings.workerUrl.replace(/\/$/,'') + '/weight');
    if(!r.ok) return;
    const d = await r.json(); // {weight: 85.4, date: 'YYYY-MM-DD'}
    if(d && d.weight){
      const existing = plog.find(p=>p.date===d.date);
      if(existing){ if(existing.weight !== d.weight){ existing.weight = d.weight; existing.source='withings'; saveAll(); render(); } }
      else { plog.push({date:d.date, weight:d.weight, source:'withings'}); saveAll(); render(); }
    }
  }catch{}
}

// ------------------------------------------------------------
// SIGNATUR: Atlas-ryggen — 15 uker som stigende fjellprofil
// ------------------------------------------------------------
function ridgeSVG(){
  const w=398, h=104, baseY=88;
  const cw = currentWeek();
  const pts = [];
  for(let i=0;i<=TOTAL_WEEKS;i++){
    const x = 8 + (w-40)*(i/TOTAL_WEEKS);
    const climb = (i/TOTAL_WEEKS)*58;
    const jag = (i%2===0? 0 : 7) + (i%5===0? -4:0);
    pts.push([x, baseY - climb + (i===0?0:jag)]);
  }
  const peakX = pts[TOTAL_WEEKS][0], peakY = pts[TOTAL_WEEKS][1];
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const doneIdx = Math.min(Math.max(cw-1,0)+((dayIdxOf(new Date())+1)/7), TOTAL_WEEKS);
  const donePts = pts.filter((_,i)=>i<=Math.floor(doneIdx));
  let doneLine='';
  if(donePts.length>1){
    doneLine = donePts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(doneIdx%1>0 && Math.floor(doneIdx)<TOTAL_WEEKS){
      const a=pts[Math.floor(doneIdx)], b=pts[Math.floor(doneIdx)+1], t=doneIdx%1;
      doneLine += ' L'+(a[0]+(b[0]-a[0])*t).toFixed(1)+' '+(a[1]+(b[1]-a[1])*t).toFixed(1);
    }
  }
  const markIdx = Math.min(doneIdx, TOTAL_WEEKS);
  const mi = Math.min(Math.floor(markIdx), TOTAL_WEEKS-1);
  const ma=pts[mi], mb=pts[Math.min(mi+1,TOTAL_WEEKS)], mt=markIdx-mi;
  const mx=ma[0]+(mb[0]-ma[0])*mt, my=ma[1]+(mb[1]-ma[1])*mt;
  const phaseTicks = PHASES.map(p=>{
    const x = 8 + (w-40)*((p.weeks[0]-1)/TOTAL_WEEKS);
    return '<text x="'+x+'" y="'+(h-2)+'" fill="var(--text3)" font-size="8.5" font-family="Outfit" font-weight="700" letter-spacing="1">'+p.name.toUpperCase()+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;display:block" role="img" aria-label="Fremdrift mot Atlas">'
    + '<path d="'+line+' L'+pts[TOTAL_WEEKS][0]+' '+baseY+' L8 '+baseY+' Z" fill="var(--card2)" opacity="0.6"/>'
    + '<path d="'+line+'" fill="none" stroke="var(--line)" stroke-width="2"/>'
    + (doneLine? '<path d="'+doneLine+'" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round"/>' : '')
    + '<circle cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="4.5" fill="var(--gold)"/>'
    + '<path d="M'+peakX+' '+peakY+' v-14 l9 3.5 -9 3.5" fill="var(--gold)" stroke="var(--gold)" stroke-width="1.5" stroke-linejoin="round"/>'
    + phaseTicks
    + '</svg>';
}

    hr:+document.getElementById('cHr').value||null,

}

  const w = Math.max(currentWeek(),1);
  const hk = HIKES[Math.min(w,TOTAL_WEEKS)];

  <button class="btn ghost sm" onclick="gotoPage('training')">← Tilbake</button>

function pageFood(){
  const cw = Math.max(currentWeek(),1);
  const todayIdx = dayIdxOf(new Date());
  if(S.foodDay==null) S.foodDay = todayIdx;
  const di = S.foodDay;
  const meals = MEALS[di];
  const t = todayStr();
  const nToday = nlog[t]||{};
  const kcal = kcalTarget(cw, di);
  const db = DIET_BREAK_WEEKS.includes(cw);
  return `
  <h1>Mat</h1>
  <div class="hscroll" style="margin:12px 0">
    ${DAYS.map((d,i)=>`<div class="week-pill ${i===di?'sel':(i===todayIdx?'cur':'')}" style="min-width:52px" onclick="S.foodDay=${i};render()">${d.slice(0,3)}</div>`).join('')}
  </div>
  <div class="card card2">
    <div class="spread">
      <div style="font-weight:800;font-style:italic;text-transform:uppercase">${DAYS[di]}</div>
      <span class="badge gold mono">${kcal} kcal</span>
    </div>
    <div class="tiny" style="margin-top:4px">
      ${db? 'Diet break: legg til ~150 g ekstra ris/poteter fordelt på måltidene.' :
        di===5? 'Turdag — mer karb, turmaten teller med.' :
        di===6? 'Hviledag — letteste dag i uka.' :
        'Måltid 1 ca. kl. 16:30 · Måltid 2 ca. kl. 20:00. Vann, kaffe og te utenom.'}
    </div>
  </div>

  ${meals.map((m,i)=>{
    const done = di===todayIdx && nToday['m'+(i+1)];
    return `<div class="card">
      <div class="spread" style="margin-bottom:8px">
        <div class="row" style="gap:10px">
          <div style="font-size:26px">${m.emoji}</div>
          <div>
            <div class="tiny">MÅLTID ${i+1}</div>
            <div style="font-weight:800;font-size:17px">${esc(m.name)}</div>
          </div>
        </div>
        ${di===todayIdx? `<div class="check ${done?'on':''}" onclick="toggleMeal('${t}',${i+1})">✓</div>`:''}
      </div>
      <div class="macro-bar">
        <div class="macro"><div class="v" style="color:var(--gold)">${m.kcal}</div><div class="l">kcal</div></div>
        <div class="macro"><div class="v">${m.protein}g</div><div class="l">protein</div></div>
        <div class="macro"><div class="v">${m.carbs}g</div><div class="l">karb</div></div>
        <div class="macro"><div class="v">${m.fat}g</div><div class="l">fett</div></div>
      </div>
      <div style="margin-top:12px">
        ${m.ing.map(x=>`<div class="tiny" style="padding:3px 0;color:var(--text2)">· ${esc(x)}</div>`).join('')}
      </div>
      <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">
        ${m.steps.map((x,n)=>`<div class="muted" style="padding:3px 0"><span class="mono" style="color:var(--gold)">${n+1}</span>&nbsp; ${esc(x)}</div>`).join('')}
      </div>
    </div>`;
  }).join('')}

  <div class="card card2">
    <div style="font-weight:700;margin-bottom:4px">Faste regler</div>
    <div class="tiny" style="line-height:1.7">
      · Kun smør, Muraglia EVOO eller ghee — aldri frøoljer<br>
      · Nitrittfri bacon · økologiske blåbær · ingen maltodekstrin/sitronsyre<br>
      · Protein-mål: 175–185 g hver dag, uansett<br>
      · Sulten mellom måltidene? Vann, salt, svart kaffe. Det går over.
    </div>
  </div>
  `;
}

function toggleMeal(date, n){
  nlog[date] = nlog[date]||{};
  nlog[date]['m'+n] = !nlog[date]['m'+n];
  saveAll(); render();
}
function toggleSupp(date, key){
  supps[date] = supps[date]||{};
  supps[date][key] = !supps[date][key];
  saveAll(); render();
}
function togglePhoto(week){ photos[week]=!photos[week]; saveAll(); render(); }
function logWeight(){
  const v = parseFloat(document.getElementById('wIn').value);
  if(!v || v<50 || v>150) return;
  const t = todayStr();
  const e = plog.find(p=>p.date===t);
  if(e){ e.weight=v; e.source='manual'; } else plog.push({date:t, weight:v, source:'manual'});
  saveAll(); toast('Vekt lagret'); render();
}
function logSleep(n){
  const t = todayStr();
  const e = plog.find(p=>p.date===t);
  if(e) e.sleep=n; else plog.push({date:t, sleep:n});
  saveAll(); render();
}

// ------------------------------------------------------------
// FREMGANG
// ------------------------------------------------------------
function pageProgress(){
  const weights = plog.filter(p=>p.weight!=null).sort((a,b)=>a.date<b.date?-1:1);
  const lw = latestWeight();
  const target = targetWeightOn(todayStr());
  const diff = lw? (lw.weight-target) : null;
  const hikes = wlog.filter(x=>x.type==='hike');
  const benches = hikes.filter(h=>h.data.benchmark);
  const totalHm = hikes.reduce((s,h)=>s+(h.data.hm||0),0);
  const streak = calcStreak();
  return `
  <h1>Fremgang</h1>
  <div class="row" style="gap:8px;margin:12px 0">
    <div class="stat"><div class="v">${lw?lw.weight:'–'}</div><div class="l">kg nå</div></div>
    <div class="stat"><div class="v">${WEIGHT_GOAL}</div><div class="l">kg mål</div></div>
    <div class="stat"><div class="v" style="color:${diff==null?'var(--text2)':diff<=0.3?'var(--green)':'var(--red)'}">${diff==null?'–':(diff>0?'+':'')+diff.toFixed(1)}</div><div class="l">vs plan</div></div>
    <div class="stat"><div class="v">${streak}</div><div class="l">dagers streak</div></div>
  </div>

  <div class="card">
    <div class="spread" style="margin-bottom:8px">
      <div style="font-weight:700">Vekt mot mål</div>
      <span class="tiny mono">86 → 76 kg innen 27. okt</span>
    </div>
    ${weightChart(weights)}
  </div>

  <h2>Benchmarkruta</h2>
  <div class="card" style="padding:6px 14px">
    ${benches.length? benches.map(b=>`<div class="list-item">
      <div style="flex:1">
        <div style="font-weight:600">Uke ${b.data.week}</div>
        <div class="tiny">${b.data.hm} hm · ${b.data.pack} kg sekk</div>
      </div>
      <div class="mono" style="color:var(--gold);font-weight:700">${Math.floor((b.data.min||0)/60)}:${pad((b.data.min||0)%60)}</div>
    </div>`).join('') : '<div class="muted" style="padding:10px 0">Benchmark-uker: 3, 7, 11 og 14. Samme rute, samme sekk — tiden viser formen.</div>'}
  </div>

  <h2>Fjellstatistikk</h2>
  <div class="row" style="gap:8px;margin-bottom:12px">
    <div class="stat"><div class="v">${hikes.length}</div><div class="l">turer</div></div>
    <div class="stat"><div class="v">${totalHm.toLocaleString('no')}</div><div class="l">hm totalt</div></div>
    <div class="stat"><div class="v">${hikes.reduce((s,h)=>s+(h.data.km||0),0).toFixed(0)}</div><div class="l">km totalt</div></div>
  </div>

  <h2>Løfte-PRs</h2>
  <div class="card" style="padding:6px 14px">
    ${['machine_chest','oh_press','wide_row','stepup','rdl'].map(id=>{
      const names={machine_chest:'Chest Press',oh_press:'Overhead Press',wide_row:'Wide Row',stepup:'Step-up',rdl:'RDL'};
      const pr=prFor(id);
      return `<div class="list-item"><div style="flex:1;font-weight:600">${names[id]}</div><div class="mono" style="color:var(--gold)">${pr?pr+' kg':'–'}</div></div>`;
    }).join('')}
  </div>

  <h2>Progressbilder</h2>
  <div class="card">
    <div class="row" style="flex-wrap:wrap;gap:6px">
      ${Array.from({length:TOTAL_WEEKS},(_,i)=>i+1).map(w=>
        `<div class="week-pill ${photos[w]?'sel':''}" style="min-width:38px" onclick="togglePhoto(${w})">${w}</div>`).join('')}
    </div>
    <div class="tiny" style="margin-top:8px">Hver søndag: samme sted, samme lys, samme positur. Bildene lagrer du i kamerarullen — her huker du av.</div>
  </div>

  <h2>Data</h2>
  <div class="row" style="gap:8px">
    <button class="btn dim" onclick="exportData()">Eksporter JSON</button>
    <button class="btn dim" onclick="document.getElementById('impFile').click()">Importer</button>
    <input type="file" id="impFile" accept=".json" style="display:none" onchange="importData(this)">
  </div>
  `;
}

function calcStreak(){
  let streak=0;
  for(let i=0;i<200;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    const di=dayIdxOf(d);
    const hasActivity = wlog.some(x=>x.date===ds) || (nlog[ds]&&(nlog[ds].m1||nlog[ds].m2)) || plog.some(p=>p.date===ds&&p.weight);
    if(di===6){ if(hasActivity||i===0) {streak = hasActivity? streak+1 : streak; continue;} else continue; }
    if(hasActivity) streak++;
    else { if(i===0) continue; break; }
  }
  return streak;
}

function weightChart(weights){
  const w=370,h=170,pl=34,pr=10,pt=12,pb=22;
  const startT=START.getTime(), endT=TRIP.getTime();
  const x = t => pl + (w-pl-pr)*Math.min(Math.max((t-startT)/(endT-startT),0),1);
  const yMin=74, yMax=88;
  const y = v => pt + (h-pt-pb)*(1-(v-yMin)/(yMax-yMin));
  const targetLine = `M${x(startT)} ${y(WEIGHT_START)} L${x(endT)} ${y(WEIGHT_GOAL)}`;
  let actual='';
  if(weights.length){
    actual = weights.map((p,i)=>(i?'L':'M')+x(new Date(p.date+'T00:00:00').getTime()).toFixed(1)+' '+y(p.weight).toFixed(1)).join(' ');
  }
  const dots = weights.slice(-1).map(p=>`<circle cx="${x(new Date(p.date+'T00:00:00').getTime()).toFixed(1)}" cy="${y(p.weight).toFixed(1)}" r="4" fill="var(--gold)"/>`).join('');
  const grid = [76,80,84,88].map(v=>`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="4" y="${y(v)+4}" fill="var(--text3)" font-size="10" font-family="JetBrains Mono">${v}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%">
    ${grid}
    <path d="${targetLine}" stroke="var(--text3)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    ${actual?`<path d="${actual}" stroke="var(--gold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>`:''}
    ${dots}
    <text x="${w-pr}" y="${h-6}" text-anchor="end" fill="var(--text3)" font-size="10" font-family="JetBrains Mono">27. OKT</text>
    <text x="${pl}" y="${h-6}" fill="var(--text3)" font-size="10" font-family="JetBrains Mono">13. JUL</text>
  </svg>
  <div class="tiny" style="margin-top:4px">Stiplet linje = planlagt kurve. Ligg på eller under den — men trend teller, ikke enkeltdager.</div>`;
}

function exportData(){
  const data = { settings, wlog, nlog, plog, supps, photos, exported: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'solfit-atlas-backup-'+todayStr()+'.json';
  a.click();
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(d.settings) settings=d.settings;
      if(d.wlog) wlog=d.wlog; if(d.nlog) nlog=d.nlog;
      if(d.plog) plog=d.plog; if(d.supps) supps=d.supps; if(d.photos) photos=d.photos;
      saveAll(); toast('Data importert ✓'); render();
    }catch{ toast('Ugyldig fil'); }
  };
  r.readAsText(f);
}
